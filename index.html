<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خليل</title>
<style>
  :root{
    --text: #10202e;
    --muted: #3f6478;
    --card: #ffffffcc;
    --line: #ffffff90;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    /* متدرج: أبيض تحت -> سماوي فاتح فوق */
    background: linear-gradient(to top, #ffffff 0%, #cdeeff 55%, #8fd3ff 100%);
    min-height: 100vh;
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
  }

  .card{
    width:100%;
    max-width: 380px;
    text-align:center;
  }

  .avatar{
    width: 116px;
    height: 116px;
    border-radius: 50%;
    margin: 0 auto 18px;
    background: #fff;
    border: 3px solid #ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    box-shadow: 0 8px 24px #4aa8dd44;
  }

  .avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  h1{
    font-size: 23px;
    font-weight: 700;
    letter-spacing: .3px;
  }

  .bio{
    color: var(--muted);
    font-size: 14px;
    margin-top: 6px;
  }

  .links{
    margin-top: 28px;
    display:flex;
    flex-direction:column;
    gap: 12px;
  }

  /* التعديل الجديد للتدرج على كل الكبسات */
  .link{
    /* حذف --tint الأصلي واستخدام تدرج */
    --tint-start: color-mix(in srgb, var(--brand) 12%, #ffffff); /* أكثر بياضاً قليلاً كبداية */
    --tint-end: color-mix(in srgb, var(--brand) 32%, #ffffff); /* فاتح كإنهاء */
    display:flex;
    align-items:center;
    gap: 14px;
    /* تطبيق التدرج */
    background: linear-gradient(135deg, var(--tint-start) 0%, var(--tint-end) 100%);
    border: 1px solid var(--tint-end); /* جعل الحدود بلون النهاية الفاتح */
    border-radius: 14px;
    padding: 14px 18px;
    text-decoration:none;
    color: var(--text);
    font-size: 14.5px;
    font-weight: 600;
    transition: transform .15s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
  }

  .link:hover{
    /* جعل التدرج يميل أكثر لداكن عند التحويم */
    background: linear-gradient(135deg, color-mix(in srgb, var(--brand) 16%, #ffffff) 0%, color-mix(in srgb, var(--brand) 40%, #ffffff) 100%);
    border-color: color-mix(in srgb, var(--brand) 40%, #ffffff);
    box-shadow: 0 6px 18px color-mix(in srgb, var(--brand) 30%, transparent);
  }

  .link:active{
    transform: scale(1.05);
    /* تغيير التدرج بشكل أكثر وضوحاً عند النقر */
    background: linear-gradient(135deg, color-mix(in srgb, var(--brand) 20%, #ffffff) 0%, color-mix(in srgb, var(--brand) 50%, #ffffff) 100%);
    border-color: color-mix(in srgb, var(--brand) 50%, #ffffff);
    box-shadow: 0 0 22px color-mix(in srgb, var(--brand) 55%, transparent);
  }

  .icon-wrap{
    width: 34px;
    height: 34px;
    border-radius: 50%;
    /* تطبيق تدرج مماثل على الأيقونة الدائرية، من أسفل لأعلى */
    background: linear-gradient(to top, var(--tint-start) 0%, var(--tint-end) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    transition: background .2s ease;
  }

  .link:active .icon-wrap{
    /* تغيير تدرج الأيقونة عند النقر */
    background: linear-gradient(to top, color-mix(in srgb, var(--brand) 16%, #ffffff) 0%, color-mix(in srgb, var(--brand) 45%, #ffffff) 100%);
  }

  .icon-wrap svg{
    width: 18px;
    height: 18px;
    stroke: var(--brand); /* الحفاظ على لون الأيقونة */
    fill: none;
  }

  footer{
    margin-top: 34px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }

  footer svg{
    width: 14px;
    height: 14px;
    stroke: var(--muted);
    fill:none;
  }
</style>
</head>
