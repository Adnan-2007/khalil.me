<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خليل</title>

<!-- استيراد خطوط احترافية لأسماء التطبيقات بالإنجليزية -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --text: #0f172a;
    --muted: #e2e8f0;
    --card: rgba(255, 255, 255, 0.1);
    --border: rgba(255, 255, 255, 0.2);
    --brand: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    color: #ffffff;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    /* التعديل هون: السماح بالنزول لتحت ومنع العرض الزايد */
    overflow-x: hidden;
    overflow-y: auto;
    background: linear-gradient(to top, #000000 0%, #030d22 45%, #09204f 100%);
    padding: 40px 0; /* مسافة من فوق وتحت عشان ما يلزق الكارت بالشاشة */
  }

  .layout-container {
    display: flex;
    width: 100%;
    max-width: 1200px;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
    z-index: 1;
    flex-wrap: wrap; 
    gap: 40px; /* مسافة بين القمر والكارت عالتلفون */
  }

  /* --- القمر مع التضاريس الواقعية --- */
  .moon-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    min-width: 300px;
    padding: 20px;
  }

  .moon {
    width: 30vw;
    max-width: 380px;
    min-width: 250px;
    aspect-ratio: 1;
    border-radius: 50%;
    /* استخدام تداخل الألوان لعمل فوهات وتضاريس */
    background: 
      radial-gradient(circle at 25% 35%, rgba(0, 0, 0, 0.15) 2%, transparent 8%),
      radial-gradient(circle at 75% 65%, rgba(0, 0, 0, 0.12) 4%, transparent 12%),
      radial-gradient(circle at 45% 80%, rgba(0, 0, 0, 0.1) 6%, transparent 15%),
      radial-gradient(circle at 85% 35%, rgba(0, 0, 0, 0.18) 5%, transparent 18%),
      radial-gradient(circle at 60% 25%, rgba(0, 0, 0, 0.08) 8%, transparent 22%),
      radial-gradient(circle at 35% 70%, rgba(0, 0, 0, 0.14) 7%, transparent 25%),
      radial-gradient(circle at 30% 30%, #ffffff 0%, #e2e8f0 55%, #94a3b8 100%);
    box-shadow: 
      0 0 70px 15px rgba(255, 255, 255, 0.25), /* الوهج الخارجي */
      inset -25px -25px 45px rgba(0, 0, 0, 0.65), /* ظل العتمة على الطرف */
      inset 10px 10px 25px rgba(255, 255, 255, 0.9); /* لمعة الضوء المقابلة */
  }

  /* --- الكارت الرئيسي --- */
  .card-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    min-width: 300px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    text-align: center;
    background: var(--card);
    padding: 32px 22px;
    border-radius: 28px;
    border: 1px solid var(--border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
  }

  /* --- تأثير تساقط الثلج المكثف --- */
  .snow-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .snowflake {
    position: absolute;
    top: -20px;
    background: #ffffff;
    border-radius: 50%;
    opacity: 0.8;
    animation: snowfall linear infinite;
  }

  /* توليد عدد كبير من الثلج بأحجام وسرعات مختلفة */
  .snow-1 { left: 5%; width: 6px; height: 6px; animation-duration: 6s; animation-delay: 0s; }
  .snow-2 { left: 12%; width: 8px; height: 8px; animation-duration: 7.5s; animation-delay: 2s; }
  .snow-3 { left: 18%; width: 5px; height: 5px; animation-duration: 5.5s; animation-delay: 1s; }
  .snow-4 { left: 24%; width: 9px; height: 9px; animation-duration: 8s; animation-delay: 3s; }
  .snow-5 { left: 30%; width: 7px; height: 7px; animation-duration: 6.5s; animation-delay: 0.5s; }
  .snow-6 { left: 38%; width: 6px; height: 6px; animation-duration: 7s; animation-delay: 4s; }
  .snow-7 { left: 45%; width: 8px; height: 8px; animation-duration: 8.5s; animation-delay: 1.5s; }
  .snow-8 { left: 52%; width: 5px; height: 5px; animation-duration: 5s; animation-delay: 2.5s; }
  .snow-9 { left: 58%; width: 7px; height: 7px; animation-duration: 6.8s; animation-delay: 3.5s; }
  .snow-10 { left: 65%; width: 6px; height: 6px; animation-duration: 7.2s; animation-delay: 0.2s; }
  .snow-11 { left: 72%; width: 8px; height: 8px; animation-duration: 6.2s; animation-delay: 1.2s; }
  .snow-12 { left: 78%; width: 5px; height: 5px; animation-duration: 5.8s; animation-delay: 2.8s; }
  .snow-13 { left: 85%; width: 9px; height: 9px; animation-duration: 7.8s; animation-delay: 0.8s; }
  .snow-14 { left: 92%; width: 7px; height: 7px; animation-duration: 8.2s; animation-delay: 3.2s; }
  .snow-15 { left: 97%; width: 6px; height: 6px; animation-duration: 6.7s; animation-delay: 1.7s; }
  .snow-16 { left: 8%; width: 4px; height: 4px; animation-duration: 5.2s; animation-delay: 4.5s; }
  .snow-17 { left: 22%; width: 10px; height: 10px; animation-duration: 9s; animation-delay: 0.3s; }
  .snow-18 { left: 35%; width: 5px; height: 5px; animation-duration: 6.1s; animation-delay: 2.1s; }
  .snow-19 { left: 48%; width: 7px; height: 7px; animation-duration: 7.4s; animation-delay: 3.8s; }
  .snow-20 { left: 62%; width: 6px; height: 6px; animation-duration: 5.9s; animation-delay: 1.4s; }
  .snow-21 { left: 75%; width: 8px; height: 8px; animation-duration: 8.1s; animation-delay: 4.2s; }
  .snow-22 { left: 88%; width: 5px; height: 5px; animation-duration: 6.3s; animation-delay: 0.7s; }
  .snow-23 { left: 15%; width: 7px; height: 7px; animation-duration: 7.6s; animation-delay: 2.4s; }
  .snow-24 { left: 82%; width: 6px; height: 6px; animation-duration: 6.9s; animation-delay: 3.1s; }
  .snow-25 { left: 42%; width: 9px; height: 9px; animation-duration: 8.4s; animation-delay: 1.9s; }

  @keyframes snowfall {
    0% { transform: translateY(-10vh) translateX(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.8; }
    100% { transform: translateY(110vh) translateX(40px); opacity: 0; }
  }

  /* --- حركات الكارد --- */
  .animate-item {
    opacity: 0;
    animation: fadeSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .avatar { animation-delay: 0.1s; }
  h1 { animation-delay: 0.2s; }
  .bio { animation-delay: 0.28s; }
  footer { animation-delay: 0.78s; }

  .avatar {
    width: 112px;
    height: 112px;
    border-radius: 50%;
    margin: 0 auto 18px;
    background: #ffffff;
    border: 3px solid #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  h1 {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: .3px;
    color: #ffffff;
  }

  .bio {
    color: var(--muted);
    font-size: 14px;
    margin-top: 6px;
  }

  .links {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* --- الأزرار والتأثيرات --- */
  .link {
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(
      120deg,
      rgba(255, 255, 255, 0.92) 0%,
      color-mix(in srgb, var(--brand) 18%, #ffffff) 35%,
      color-mix(in srgb, var(--brand) 32%, #ffffff) 65%,
      rgba(255, 255, 255, 0.95) 100%
    );
    background-size: 200% 200%;
    border: 1px solid color-mix(in srgb, var(--brand) 30%, #cbd5e1);
    border-radius: 16px;
    padding: 12px 18px;
    text-decoration: none;
    color: var(--text);
    box-shadow: 0 4px 15px color-mix(in srgb, var(--brand) 12%, transparent);
    animation: 
      fadeSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards,
      floatButtonFast 1.6s ease-in-out infinite alternate,
      buttonSpectrum 3.5s ease infinite alternate;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .link:nth-child(1) { animation-delay: 0.38s, 0.1s, 0s; }
  .link:nth-child(2) { animation-delay: 0.48s, 0.4s, 0s; }
  .link:nth-child(3) { animation-delay: 0.58s, 0.7s, 0s; }
  .link:nth-child(4) { animation-delay: 0.68s, 1.0s, 0s; }

  @keyframes floatButtonFast {
    0% { transform: translateY(0); }
    100% { transform: translateY(-10px); }
  }

  @keyframes buttonSpectrum {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
  }

  .link:hover {
    border-color: var(--brand);
    box-shadow: 0 8px 22px color-mix(in srgb, var(--brand) 25%, transparent);
  }

  .link:active {
    transform: scale(0.96) !important;
    background: color-mix(in srgb, var(--brand) 20%, #ffffff);
    box-shadow: 0 2px 8px color-mix(in srgb, var(--brand) 30%, transparent);
  }

  .icon-wrap {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: linear-gradient(
      135deg,
      color-mix(in srgb, var(--brand) 40%, #ffffff),
      var(--brand),
      color-mix(in srgb, var(--brand) 65%, #000000),
      color-mix(in srgb, var(--brand) 80%, #ffffff),
      var(--brand)
    );
    background-size: 300% 300%;
    animation: spectrumFlow 3.5s ease infinite;
    box-shadow: 0 4px 14px color-mix(in srgb, var(--brand) 35%, transparent);
    border: 1.5px solid color-mix(in srgb, var(--brand) 40%, #ffffff);
  }

  .icon-wrap::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
      45deg,
      transparent 35%,
      rgba(255, 255, 255, 0.65) 50%,
      transparent 65%
    );
    animation: shineSweep 2.8s infinite ease-in-out;
  }

  @keyframes spectrumFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @keyframes shineSweep {
    0% { transform: translateX(-120%) translateY(-120%) rotate(25deg); }
    100% { transform: translateX(120%) translateY(120%) rotate(25deg); }
  }

  .icon-wrap svg {
    width: 18px;
    height: 18px;
    stroke: #ffffff;
    fill: none;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.35));
  }

  .link-text {
    direction: ltr;
    display: inline-block;
  }

  .font-insta {
    font-family: 'Grand Hotel', cursive;
    font-size: 24px;
    font-weight: 400;
    letter-spacing: 0.5px;
    background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .font-snap {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.3px;
    color: #1e293b;
  }

  .font-threads {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.4px;
    color: #0f172a;
  }

  .font-vsco {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2.5px;
    color: #334155;
  }

  /* --- تنسيقات الفوتر والكبسة الجديدة --- */
  footer {
    margin-top: 34px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
  }

  .footer-name {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .footer-name svg {
    width: 14px;
    height: 14px;
    stroke: var(--muted);
    fill: none;
  }

  .promo-btn {
    color: #38bdf8;
    text-decoration: none;
    font-weight: bold;
    background: rgba(255, 255, 255, 0.08);
    padding: 6px 12px;
    border-radius: 12px;
    border: 1px solid rgba(56, 189, 248, 0.3);
    transition: all 0.3s ease;
    font-size: 11px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  .promo-btn:hover {
    background: rgba(56, 189, 248, 0.2);
    color: #ffffff;
    border-color: #38bdf8;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
  }
</style>
</head>
<body>

  <div class="snow-container">
    <div class="snowflake snow-1"></div>
    <div class="snowflake snow-2"></div>
    <div class="snowflake snow-3"></div>
    <div class="snowflake snow-4"></div>
    <div class="snowflake snow-5"></div>
    <div class="snowflake snow-6"></div>
    <div class="snowflake snow-7"></div>
    <div class="snowflake snow-8"></div>
    <div class="snowflake snow-9"></div>
    <div class="snowflake snow-10"></div>
    <div class="snowflake snow-11"></div>
    <div class="snowflake snow-12"></div>
    <div class="snowflake snow-13"></div>
    <div class="snowflake snow-14"></div>
    <div class="snowflake snow-15"></div>
    <div class="snowflake snow-16"></div>
    <div class="snowflake snow-17"></div>
    <div class="snowflake snow-18"></div>
    <div class="snowflake snow-19"></div>
    <div class="snowflake snow-20"></div>
    <div class="snowflake snow-21"></div>
    <div class="snowflake snow-22"></div>

    <div class="snowflake snow-24"></div>

  </div>

  <div class="layout-container">

    <div class="moon-container">
      <div class="moon"></div>

    <!-- الكارد الرئيسي -->
    <div class="card-container">

              <svg viewBox="0 0 24 24" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1"/></svg>

              <svg viewBox="0 0 24 24" stroke-width="1.8"><path d="M12 4c2.6 0 4.5 2 4.5 4.6 0 1.1-.1 2.1-.3 3 .8.5 1.8.7 1.8 1.4 0 .5-.6.8-1.4 1.1-.3.1-.5.4-.4.7.2.7.6 1.4 1.4 1.7.3.1.2.6-.1.6-.6.1-1 .2-1.2.4-.2.2-.1.7-.5 1-.5.4-1.6-.1-2.5.2-.7.3-1.2 1-2.3 1s-1.6-.7-2.3-1c-.9-.3-2 .2-2.5-.2-.4-.3-.3-.8-.5-1-.2-.2-.6-.3-1.2-.4-.3 0-.4-.5-.1-.6.8-.3 1.2-1 1.4-1.7.1-.3-.1-.6-.4-.7-.8-.3-1.4-.6-1.4-1.1 0-.7 1-.9 1.8-1.4-.2-.9-.3-1.9-.3-3C7.5 6 9.4 4 12 4z"/></svg>

      </div>
    </div>
    
  </div>

</body>
</html>
