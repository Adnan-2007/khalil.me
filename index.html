<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خليل</title>

<!-- استيراد خطوط احترافية لأسماء التطبيقات بالإنجليزية -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --text: #0f172a;
    --muted: #64748b;
    --card: rgba(255, 255, 255, 0.75);
    --border: rgba(255, 255, 255, 0.8);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    min-height: 100vh;
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    position: relative;
    overflow-x: hidden;
    background-color: #f8fafc;
  }

  /* --- خلفية البقع الملونة العائمة --- */
  .ambient-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.55;
    animation: floatOrb 12s infinite alternate ease-in-out;
  }

  .orb-1 {
    width: 280px;
    height: 280px;
    background: #c084fc;
    top: -40px;
    right: -40px;
    animation-duration: 14s;
  }

  .orb-2 {
    width: 320px;
    height: 320px;
    background: #38bdf8;
    bottom: -60px;
    left: -60px;
    animation-duration: 18s;
  }

  .orb-3 {
    width: 220px;
    height: 220px;
    background: #f472b6;
    top: 40%;
    left: 20%;
    animation-duration: 10s;
  }

  @keyframes floatOrb {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(35px, 45px) scale(1.12); }
  }

  /* --- الكارت الرئيسي --- */
  .card{
    width: 100%;
    max-width: 380px;
    text-align: center;
    position: relative;
    z-index: 1;
    background: var(--card);
    padding: 32px 22px;
    border-radius: 28px;
    border: 1px solid var(--border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 20px 40px rgba(15, 23, 42, 0.05);
  }

  /* --- حركة دخول العناصر عند الفتح --- */
  .animate-item {
    opacity: 0;
    animation: fadeSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes fadeSlideUp {
    from {
      opacity: 0;
      transform: translateY(24px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .avatar { animation-delay: 0.1s; }
  h1 { animation-delay: 0.2s; }
  .bio { animation-delay: 0.28s; }
  footer { animation-delay: 0.78s; }

  .avatar{
    width: 112px;
    height: 112px;
    border-radius: 50%;
    margin: 0 auto 18px;
    background: #ffffff;
    border: 3px solid #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
  }

  .avatar img{
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  h1{
    font-size: 23px;
    font-weight: 700;
    letter-spacing: .3px;
  }

  .bio{
    color: var(--muted);
    font-size: 14px;
    margin-top: 6px;
  }

  .links{
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* --- تصميم الكبسات والتأثير الطيفي الفاتح + التطاير العائم --- */
  .link{
    display: flex;
    align-items: center;
    gap: 14px;

    /* لون طيفي فاتح مكس بلون التطبيق داخل الفراغ */
    background: linear-gradient(
      120deg,
      rgba(255, 255, 255, 0.92) 0%,
      color-mix(in srgb, var(--brand) 18%, #ffffff) 35%,
      color-mix(in srgb, var(--brand) 32%, #ffffff) 65%,
      rgba(255, 255, 255, 0.95) 100%
    );
    background-size: 200% 200%;
    border: 1px solid color-mix(in srgb, var(--brand) 30%, #cbd5e1);
    border-radius: 16px;
    padding: 12px 18px;
    text-decoration: none;
    color: var(--text);
    box-shadow: 0 4px 15px color-mix(in srgb, var(--brand) 12%, transparent);

    /* دمج حركة الدخول مع حركة التطاير الخفيف والطيف المتحرك */
    animation: 
      fadeSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards,
      floatButton 3.8s ease-in-out infinite alternate,
      buttonSpectrum 6s ease infinite alternate;

    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  /* توقيت التتابع للدخول والتطاير لتطوف الكبسات بشكل متناسق */
  .link:nth-child(1) { animation-delay: 0.38s, 0.8s, 0s; }
  .link:nth-child(2) { animation-delay: 0.48s, 1.4s, 0s; }
  .link:nth-child(3) { animation-delay: 0.58s, 2.0s, 0s; }
  .link:nth-child(4) { animation-delay: 0.68s, 2.6s, 0s; }

  /* انيميشن التطاير للأعلى والأسفل بشكل خفيف */
  @keyframes floatButton {
    0% { transform: translateY(0); }
    100% { transform: translateY(-5px); }
  }

  /* انيميشن تموج الطيف الفاتح داخل الكبسة */
  @keyframes buttonSpectrum {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
  }

  .link:hover{
    border-color: var(--brand);
    box-shadow: 0 8px 22px color-mix(in srgb, var(--brand) 25%, transparent);
  }

  .link:active{
    transform: scale(0.96) !important;
    background: color-mix(in srgb, var(--brand) 20%, #ffffff);
    box-shadow: 0 2px 8px color-mix(in srgb, var(--brand) 30%, transparent);
  }

  /* الأيقونة والتأثير الطيفي الخاص بها */
  .icon-wrap{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: linear-gradient(
      135deg,
      color-mix(in srgb, var(--brand) 40%, #ffffff),
      var(--brand),
      color-mix(in srgb, var(--brand) 65%, #000000),
      color-mix(in srgb, var(--brand) 80%, #ffffff),
      var(--brand)
    );
    background-size: 300% 300%;
    animation: spectrumFlow 3.5s ease infinite;
    box-shadow: 0 4px 14px color-mix(in srgb, var(--brand) 35%, transparent);
    border: 1.5px solid color-mix(in srgb, var(--brand) 40%, #ffffff);
  }

  .icon-wrap::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
      45deg,
      transparent 35%,
      rgba(255, 255, 255, 0.65) 50%,
      transparent 65%
    );
    animation: shineSweep 2.8s infinite ease-in-out;
  }

  @keyframes spectrumFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @keyframes shineSweep {
    0% { transform: translateX(-120%) translateY(-120%) rotate(25deg); }
    100% { transform: translateX(120%) translateY(120%) rotate(25deg); }
  }

  .icon-wrap svg{
    width: 18px;
    height: 18px;
    stroke: #ffffff;
    fill: none;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.35));
  }

  /* --- تنسيقات النصوص والخطوط --- */
  .link-text {
    direction: ltr;
    display: inline-block;
  }

  /* خط انستغرام المائل الملون */
  .font-insta {
    font-family: 'Grand Hotel', cursive;
    font-size: 24px;
    font-weight: 400;
    letter-spacing: 0.5px;
    background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* خط سناب شات */
  .font-snap {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.3px;
    color: #1e293b;
  }

  /* خط ثريدز */
  .font-threads {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.4px;
    color: #0f172a;
  }

  /* خط VSCO */
  .font-vsco {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2.5px;
    color: #334155;
  }

  footer{
    margin-top: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }

  footer svg{
    width: 14px;
    height: 14px;
    stroke: var(--muted);
    fill: none;
  }
</style>
</head>
<body>

  <!-- خلفية البقع العائمة -->
  <div class="ambient-bg">

  </div>

</body>
</html>
